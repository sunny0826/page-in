name: Desktop release candidate packages

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character source commit for the authorized v0.0.1 rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-desktop-v0.0.1
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            bundles: nsis
          - runner: ubuntu-22.04
            platform: linux-x64
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: release-source
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_INCREMENTAL: "0"
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve repository line endings
        working-directory: .
        run: git config --global core.autocrlf false
      - name: Check out immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          path: release-source
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: jdx/mise-action@v4
        with:
          working_directory: release-source
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release-source/src-tauri -> target
      - name: Verify source and tool versions
        run: |
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          mise exec -- node --version
          mise exec -- npm --version
          mise exec -- rustc --version
          mise exec -- cargo --version
      - name: Install locked frontend dependencies
        run: mise exec -- npm ci
      - name: Run release checks
        run: |
          mise exec -- npm run version:check
          mise exec -- npm run typecheck
          mise exec -- npm test
          mise exec -- cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build native packages
        run: mise exec -- npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect packages and provenance
        run: mise exec -- node scripts/package-ci-release.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-source/release-assets/*
          if-no-files-found: error
          retention-days: 14
